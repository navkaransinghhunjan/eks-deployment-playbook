# Karpenter capacity for the tenant-c services — install-log.md § 17.
# No GPU pool: no tenant-c service requests nvidia.com/gpu (§ 18).
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: <POOL>
spec:
  amiFamily: AL2023
  role: KarpenterNodeRole-non-prod
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags: { karpenter.sh/discovery: non-prod }
  securityGroupSelectorTerms:
    - tags: { karpenter.sh/discovery: non-prod }
  # 200Gi, not the 20Gi default: medical-bills-nlp is a torch+TF image and the weights
  # hostPath (/opt/models/<POOL>) lives here.
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 200Gi
        volumeType: gp3
        deleteOnTermination: true
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: <POOL>
spec:
  template:
    metadata:
      labels: { workload: <POOL> }
    spec:
      taints:
        - key: workload
          value: <POOL>
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: <POOL>
      expireAfter: 720h
  limits:
    cpu: "100"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    # Must outrun the services' scaledownPeriod (§ 25) or the next request re-pays a node boot.
    consolidateAfter: 10m
