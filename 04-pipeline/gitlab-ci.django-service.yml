# Self-contained: no `include:` of <CI_TEMPLATES_PROJECT>. Shape follows tenant-b
# (av_bfsi_controller/.gitlab-ci.yml); see arch_knowlenge_base <NAMESPACE>/install-log.md § 24.
#
# Deploys into ns `<NAMESPACE>` — tenant-c shares that namespace with the Temporal / doc-ai-service
# workloads rather than having its own (§ 16).
variables:
  AWS_REGION: ap-south-1
  ECR_HOST: <AWS_ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPO: <POOL>/example-<NAMESPACE>-api
  SVC_IMAGE: $ECR_HOST/$ECR_REPO:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  BRANCH_IMAGE: $ECR_HOST/$ECR_REPO:$CI_COMMIT_REF_SLUG
  CACHE_IMAGE: $ECR_HOST/$ECR_REPO:cache

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "eks"'
    - if: '$CI_COMMIT_BRANCH == "eks-uat"'
    - if: "$CI_COMMIT_TAG"

stages:
  - test
  - build
  - deploy

builderrors:
  stage: test
  allow_failure: true
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/gramener/builderrors:3.2.0
  script:
    - builderrors

build:
  stage: build
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/shraddheya/k8s-tools:alpine-1.36-1
  services:
    # alias: behind the proxy the image name is no longer "docker".
    - name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/docker:27-dind
      alias: docker
  timeout: 2h
  # Runner pools are spot. A reclaim kills dind and the docker CLI exits 1, which GitLab
  # records as script_failure — a retry list without it never fires.
  retry:
    max: 2
    when: [script_failure, runner_system_failure, stuck_or_timeout_failure]
  before_script:
    # No static keys: the job pod's IRSA role covers ECR. Same override hazard as .k8s.
    - unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE
    - aws sts get-caller-identity
    - aws ecr get-login-password --region "$AWS_REGION"
      | docker login --username AWS --password-stdin "$ECR_HOST"
  script:
    # this branch's own last push first, else the shared tag so a new branch starts warm
    - docker pull "$BRANCH_IMAGE" || docker pull "$CACHE_IMAGE" || true
    - docker build --build-arg BUILDKIT_INLINE_CACHE=1
      --cache-from "$BRANCH_IMAGE" --cache-from "$CACHE_IMAGE" -t "$SVC_IMAGE" .
    - docker push "$SVC_IMAGE"
    - docker tag "$SVC_IMAGE" "$BRANCH_IMAGE" && docker push "$BRANCH_IMAGE"
    - docker tag "$SVC_IMAGE" "$CACHE_IMAGE"  && docker push "$CACHE_IMAGE"
    - echo "image  $SVC_IMAGE"
    - echo "size   $(docker image inspect "$SVC_IMAGE" --format '{{.Size}}') bytes"
    - echo "digest $(docker image inspect "$SVC_IMAGE" --format '{{index .RepoDigests 0}}')"
  rules:
    - when: manual

.k8s:
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/shraddheya/k8s-tools:alpine-1.36-1
  before_script:
    # A group/project CI variable holding a human's static key OVERRIDES the job pod's IRSA,
    # and named humans carry AmazonEKSAdminPolicy — which derives from the `admin` ClusterRole
    # and covers no custom resources. The deploy then applies Deployment and Service and 403s
    # on every traefik.io / http.keda.sh object, leaving a half-applied service. Seen
    # 2026-09-16; see ci/deploy-access.md.
    - unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE
    - aws sts get-caller-identity
    # Fail before touching the cluster, not halfway through it.
    - |
      aws sts get-caller-identity --query Arn --output text \
        | grep -q 'GitLabRunnerJobsRole-non-prod' || {
          echo "FATAL - not the runner IRSA role; traefik/keda objects would 403"
          exit 1
        }
    # Cluster name is a literal, never a CI variable — a group variable once redirected a
    # non-prod deploy to the POC cluster (ci/deploy-access.md).
    - aws eks --region "$AWS_REGION" update-kubeconfig --name non-prod
    - kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}{"\n"}'

.deploy:
  extends: .k8s
  stage: deploy
  needs: ["build"]
  variables:
    SVC_POOL: <POOL>
    # Overridden per environment so dev and UAT never share config.
    SVC_ENDPOINTS: <SHARED_CONFIGMAP>
    SVC_SECRET: <SVC>-secret
  script:
    - apk add --no-cache gettext
    # The media PVC must exist before either Deployment references it.
    - envsubst '$SVC_NAME' < kubernetes/media-pvc.yaml | kubectl apply -f -
    # The broker must exist before the worker and beat start looking for it (C56).
    - envsubst '$SVC_NAME $SVC_POOL' < kubernetes/redis.yaml | kubectl apply -f -
    - kubectl -n <NAMESPACE> rollout status deploy/$SVC_NAME-redis --timeout=300s
    # migrate before the Deployments are updated. A Job's pod template is immutable, so
    # delete first; --wait so the delete completes before the create.
    - kubectl -n <NAMESPACE> delete job/$SVC_NAME-migrate --ignore-not-found --wait=true
    - envsubst '$SVC_NAME $SVC_IMAGE $SVC_POOL $SVC_PATH $SVC_ENDPOINTS $SVC_SECRET'
      < kubernetes/migrate-job.yaml | kubectl apply -f -
    # Watch for failure as well as success. `wait --for=condition=complete` alone ignores a
    # Failed job and burns the whole timeout before reporting, which reads as a hung deploy.
    - |
      for i in $(seq 1 120); do
        if kubectl -n <NAMESPACE> get job/$SVC_NAME-migrate -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' | grep -q True; then
          echo "migrate: complete"; break
        fi
        if kubectl -n <NAMESPACE> get job/$SVC_NAME-migrate -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' | grep -q True; then
          echo "migrate: FAILED"; kubectl -n <NAMESPACE> logs job/$SVC_NAME-migrate --tail=40 || true; exit 1
        fi
        sleep 5
      done
    - kubectl -n <NAMESPACE> get job/$SVC_NAME-migrate -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' | grep -q True
      || { echo "migrate did not complete within 600s"; kubectl -n <NAMESPACE> logs job/$SVC_NAME-migrate --tail=40 || true; exit 1; }
    - kubectl -n <NAMESPACE> logs job/$SVC_NAME-migrate --tail=15
    - envsubst '$SVC_NAME $SVC_IMAGE $SVC_POOL $SVC_PATH $SVC_ENDPOINTS $SVC_SECRET'
      < kubernetes/example-<NAMESPACE>-api.yaml | kubectl apply -f -
      # Worker and beat are always on, so unlike the web Deployment these must actually
      # roll out — a failure here is real, not KEDA holding a pod at zero.
    - kubectl -n <NAMESPACE> rollout status deploy/$SVC_NAME-worker --timeout=600s
    - kubectl -n <NAMESPACE> rollout status deploy/$SVC_NAME-beat --timeout=600s
    - kubectl -n <NAMESPACE> get deploy/$SVC_NAME deploy/$SVC_NAME-worker deploy/$SVC_NAME-beat svc/$SVC_NAME httpscaledobject.http.keda.sh/$SVC_NAME
    # KEDA holds the web pod at 0, so rollout status on it would pass without pulling the image.
    - 'echo "deployed $SVC_NAME to pool $SVC_POOL — web held at 0 by KEDA, worker + beat running"'
    - 'echo "url  https://<PUBLIC_HOST>$SVC_PATH"'
    - 'echo "wake it in-cluster before believing it; see <NAMESPACE>/install-log.md § 26"'
  rules:
    - when: manual

.teardown:
  extends: .k8s
  stage: deploy
  needs: []
  variables:
    GIT_STRATEGY: none
  script:
    # The PVC is deliberately NOT deleted — it holds uploaded documents. Branch
    # environments therefore leave a ${SVC_NAME}-media claim behind; delete those by hand
    # once the branch is finished with.
    - kubectl -n <NAMESPACE> delete --ignore-not-found
      deployment/$SVC_NAME deployment/$SVC_NAME-worker deployment/$SVC_NAME-beat deployment/$SVC_NAME-redis
      service/$SVC_NAME service/$SVC_NAME-backend service/$SVC_NAME-redis
      httpscaledobject.http.keda.sh/$SVC_NAME
      middleware.traefik.io/strip-$SVC_NAME middleware.traefik.io/host-$SVC_NAME
      ingressroute.traefik.io/$SVC_NAME
      job/$SVC_NAME-migrate
  rules:
    - when: manual

deploy:
  extends: .deploy
  variables:
    SVC_NAME: example-<NAMESPACE>-api
    SVC_PATH: /example_api/eks
  environment:
    name: nonprod/example-<NAMESPACE>-api
    url: https://<PUBLIC_HOST>/example_api/eks

deploy:uat:
  extends: .deploy
  variables:
    SVC_NAME: example-<NAMESPACE>-api-uat
    SVC_PATH: /example_api/uat
    SVC_ENDPOINTS: <SHARED_CONFIGMAP>-uat
    SVC_SECRET: <SVC>-secret
  environment:
    name: uat/example-<NAMESPACE>-api
    url: https://<PUBLIC_HOST>/example_api/uat

teardown:uat:
  extends: .teardown
  variables:
    SVC_NAME: example-<NAMESPACE>-api-uat
  environment:
    name: uat/example-<NAMESPACE>-api
    action: stop

deploy:branch:
  extends: .deploy
  variables:
    SVC_NAME: example-<NAMESPACE>-api-$CI_COMMIT_REF_SLUG
    SVC_PATH: /example_api/$CI_COMMIT_REF_SLUG
  environment:
    name: nonprod/example-<NAMESPACE>-api-$CI_COMMIT_REF_SLUG
    url: https://<PUBLIC_HOST>/example_api/$CI_COMMIT_REF_SLUG
    on_stop: teardown:branch

teardown:branch:
  extends: .teardown
  variables:
    SVC_NAME: example-<NAMESPACE>-api-$CI_COMMIT_REF_SLUG
  environment:
    name: nonprod/example-<NAMESPACE>-api-$CI_COMMIT_REF_SLUG
    action: stop
